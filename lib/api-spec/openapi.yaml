openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: warung
    description: Authenticated warung data
  - name: drive
    description: Google Drive backups
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /warung/state:
    get:
      operationId: getWarungState
      tags: [warung]
      summary: Get the current user's warung state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The saved state for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarungStateResponse"
        "401":
          description: Authentication required
        "404":
          description: No state has been saved yet
    put:
      operationId: saveWarungState
      tags: [warung]
      summary: Save the current user's warung state
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveWarungStateBody"
      responses:
        "200":
          description: The saved state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarungStateResponse"
        "400":
          description: Invalid state
        "401":
          description: Authentication required
        "409":
          description: The snapshot is based on an older version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarungStateConflict"
  /drive/backup:
    post:
      operationId: saveDriveBackup
      tags: [drive]
      summary: Save the current user's warung state to Google Drive
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDriveBackupBody"
      responses:
        "200":
          description: The created Google Drive backup file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveDriveBackupResponse"
        "400":
          description: Invalid state
        "401":
          description: Authentication required
        "409":
          description: Google Drive is not connected for this account
        "502":
          description: Google Drive upload failed
  /drive/connection:
    get:
      operationId: getDriveConnection
      tags: [drive]
      summary: Get the current user's Google Drive connection
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Google Drive connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveConnectionResponse"
        "401":
          description: Authentication required
  /drive/oauth/exchange:
    post:
      operationId: connectDrive
      tags: [drive]
      summary: Connect the current user's Google Drive account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectDriveBody"
      responses:
        "200":
          description: Google Drive connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveConnectionResponse"
        "400":
          description: Invalid OAuth exchange
        "401":
          description: Authentication required
        "502":
          description: Google OAuth exchange failed
  /drive/oauth/disconnect:
    delete:
      operationId: disconnectDrive
      tags: [drive]
      summary: Disconnect the current user's Google Drive account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Google Drive disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisconnectDriveResponse"
        "401":
          description: Authentication required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WarungState:
      type: object
      additionalProperties: true
      required:
        - menus
        - activeOrders
        - kitchenOrders
        - inventory
        - consignments
        - expenses
        - sales
        - cashClosures
        - savingsRules
        - savingsEntries
      properties:
        menus:
          type: array
          items:
            type: object
            additionalProperties: true
        activeOrders:
          type: array
          items:
            type: object
            additionalProperties: true
        kitchenOrders:
          type: array
          items:
            type: object
            additionalProperties: true
        inventory:
          type: array
          items:
            type: object
            additionalProperties: true
        stockMovements:
          type: array
          items:
            type: object
            additionalProperties: true
        consignments:
          type: array
          items:
            type: object
            additionalProperties: true
        expenses:
          type: array
          items:
            type: object
            additionalProperties: true
        sales:
          type: array
          items:
            type: object
            additionalProperties: true
        auditTrail:
          type: array
          items:
            type: object
            additionalProperties: true
        cashClosures:
          type: array
          items:
            type: object
            additionalProperties: true
        savingsRules:
          type: array
          items:
            type: object
            additionalProperties: true
        savingsEntries:
          type: array
          items:
            type: object
            additionalProperties: true
        qrisImageUri:
          type:
            - string
            - "null"
    SaveWarungStateBody:
      type: object
      required:
        - state
        - baseVersion
      properties:
        state:
          $ref: "#/components/schemas/WarungState"
        baseVersion:
          type:
            - integer
            - "null"
          minimum: 1
          description: Version read before editing; null when creating the first snapshot
    WarungStateResponse:
      type: object
      required:
        - state
        - version
        - updatedAt
      properties:
        state:
          $ref: "#/components/schemas/WarungState"
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    WarungStateConflict:
      type: object
      required:
        - error
        - state
        - version
        - updatedAt
      properties:
        error:
          type: string
          enum: [WARUNG_STATE_CONFLICT]
        state:
          $ref: "#/components/schemas/WarungState"
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    SaveDriveBackupBody:
      type: object
      required:
        - state
      properties:
        state:
          $ref: "#/components/schemas/WarungState"
    SaveDriveBackupResponse:
      type: object
      required:
        - id
        - name
        - webViewLink
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        webViewLink:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
    DriveConnectionResponse:
      type: object
      required:
        - connected
        - email
        - connectedAt
      properties:
        connected:
          type: boolean
        email:
          type:
            - string
            - "null"
        connectedAt:
          type:
            - string
            - "null"
          format: date-time
    ConnectDriveBody:
      type: object
      required:
        - code
        - redirectUri
        - codeVerifier
      properties:
        code:
          type: string
          minLength: 1
        redirectUri:
          type: string
          minLength: 1
        codeVerifier:
          type: string
          minLength: 43
    DisconnectDriveResponse:
      type: object
      required:
        - disconnected
      properties:
        disconnected:
          type: boolean

