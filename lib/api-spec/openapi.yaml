openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: warung
    description: Authenticated warung data
  - name: drive
    description: Google Drive backups
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /warung/state:
    get:
      operationId: getWarungState
      tags: [warung]
      summary: Get the current user's warung state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The saved state for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarungStateResponse"
        "401":
          description: Authentication required
        "404":
          description: No state has been saved yet
    put:
      operationId: saveWarungState
      tags: [warung]
      summary: Save the current user's warung state
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveWarungStateBody"
      responses:
        "200":
          description: The saved state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarungStateResponse"
        "400":
          description: Invalid state
        "401":
          description: Authentication required
        "409":
          description: The snapshot is based on an older version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarungStateConflict"
  /drive/backup:
    post:
      operationId: saveDriveBackup
      tags: [drive]
      summary: Save the current user's warung state to Google Drive
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDriveBackupBody"
      responses:
        "200":
          description: The created Google Drive backup file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveDriveBackupResponse"
        "400":
          description: Invalid state
        "401":
          description: Authentication required
        "409":
          description: Google Drive is not connected for this account
        "502":
          description: Google Drive upload failed
  /drive/image:
    post:
      operationId: uploadDriveImage
      tags: [drive]
      summary: Upload one backup image to Google Drive
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriveImageUploadBody"
      responses:
        "200":
          description: The uploaded Google Drive image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveImageUploadResponse"
        "400":
          description: Invalid image
        "401":
          description: Authentication required
        "409":
          description: Google Drive is not connected for this account
        "502":
          description: Google Drive upload failed
  /drive/image/{fileId}:
    get:
      operationId: getDriveImage
      tags: [drive]
      summary: Download one backup image from Google Drive
      security:
        - bearerAuth: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The downloaded Google Drive image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveImageResponse"
        "401":
          description: Authentication required
        "404":
          description: Image not found
        "502":
          description: Google Drive download failed
  /drive/backups:
    get:
      operationId: listDriveBackups
      tags: [drive]
      summary: List the current user's Kasir Miso Google Drive backups
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Available Google Drive backups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveBackupListResponse"
        "401":
          description: Authentication required
  /drive/restore:
    post:
      operationId: restoreDriveBackup
      tags: [drive]
      summary: Read a Kasir Miso backup manifest from Google Drive
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreDriveBackupBody"
      responses:
        "200":
          description: The backup manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreDriveBackupResponse"
        "400":
          description: Invalid backup file
        "401":
          description: Authentication required
        "404":
          description: Backup not found
        "502":
          description: Google Drive download failed
  /drive/connection:
    get:
      operationId: getDriveConnection
      tags: [drive]
      summary: Get the current user's Google Drive connection
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Google Drive connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveConnectionResponse"
        "401":
          description: Authentication required
  /drive/oauth/exchange:
    post:
      operationId: connectDrive
      tags: [drive]
      summary: Connect the current user's Google Drive account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectDriveBody"
      responses:
        "200":
          description: Google Drive connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveConnectionResponse"
        "400":
          description: Invalid OAuth exchange
        "401":
          description: Authentication required
        "502":
          description: Google OAuth exchange failed
  /drive/oauth/disconnect:
    delete:
      operationId: disconnectDrive
      tags: [drive]
      summary: Disconnect the current user's Google Drive account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Google Drive disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisconnectDriveResponse"
        "401":
          description: Authentication required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WarungState:
      type: object
      additionalProperties: true
      required:
        - menus
        - activeOrders
        - kitchenOrders
        - inventory
        - consignments
        - expenses
        - sales
        - cashClosures
        - savingsRules
        - savingsEntries
      properties:
        menus:
          type: array
          items:
            type: object
            additionalProperties: true
        activeOrders:
          type: array
          items:
            type: object
            additionalProperties: true
        kitchenOrders:
          type: array
          items:
            type: object
            additionalProperties: true
        inventory:
          type: array
          items:
            type: object
            additionalProperties: true
        stockMovements:
          type: array
          items:
            type: object
            additionalProperties: true
        consignments:
          type: array
          items:
            type: object
            additionalProperties: true
        expenses:
          type: array
          items:
            type: object
            additionalProperties: true
        sales:
          type: array
          items:
            type: object
            additionalProperties: true
        auditTrail:
          type: array
          items:
            type: object
            additionalProperties: true
        cashClosures:
          type: array
          items:
            type: object
            additionalProperties: true
        savingsRules:
          type: array
          items:
            type: object
            additionalProperties: true
        savingsEntries:
          type: array
          items:
            type: object
            additionalProperties: true
        qrisImageUri:
          type:
            - string
            - "null"
    SaveWarungStateBody:
      type: object
      required:
        - state
        - baseVersion
      properties:
        state:
          $ref: "#/components/schemas/WarungState"
        baseVersion:
          type:
            - integer
            - "null"
          minimum: 1
          description: Version read before editing; null when creating the first snapshot
    WarungStateResponse:
      type: object
      required:
        - state
        - version
        - updatedAt
      properties:
        state:
          $ref: "#/components/schemas/WarungState"
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    WarungStateConflict:
      type: object
      required:
        - error
        - state
        - version
        - updatedAt
      properties:
        error:
          type: string
          enum: [WARUNG_STATE_CONFLICT]
        state:
          $ref: "#/components/schemas/WarungState"
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    SaveDriveBackupBody:
      type: object
      required:
        - state
      properties:
        state:
          $ref: "#/components/schemas/WarungState"
    SaveDriveBackupResponse:
      type: object
      required:
        - id
        - name
        - webViewLink
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        webViewLink:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
    DriveImageUploadBody:
      type: object
      required:
        - fileName
        - mimeType
        - base64
      properties:
        fileName:
          type: string
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        base64:
          type: string
          description: Base64-encoded image bytes without a data URI prefix
    DriveImageResponse:
      type: object
      required:
        - id
        - mimeType
        - base64
      properties:
        id:
          type: string
        name:
          type: string
        mimeType:
          type: string
        base64:
          type: string
    DriveImageUploadResponse:
      type: object
      required:
        - id
        - mimeType
      properties:
        id:
          type: string
        name:
          type: string
        mimeType:
          type: string
    DriveBackupSummary:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        webViewLink:
          type:
            - string
            - "null"
    DriveBackupListResponse:
      type: object
      required:
        - backups
      properties:
        backups:
          type: array
          items:
            $ref: "#/components/schemas/DriveBackupSummary"
    RestoreDriveBackupBody:
      type: object
      required:
        - fileId
      properties:
        fileId:
          type: string
    RestoreDriveBackupResponse:
      type: object
      required:
        - format
        - version
        - target
        - createdAt
        - data
      properties:
        format:
          type: string
          enum: [kasir-miso-backup]
        version:
          type: integer
          enum: [1]
        target:
          type: string
          enum: [google-drive]
        createdAt:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/WarungState"
    DriveConnectionResponse:
      type: object
      required:
        - connected
        - email
        - connectedAt
      properties:
        connected:
          type: boolean
        email:
          type:
            - string
            - "null"
        connectedAt:
          type:
            - string
            - "null"
          format: date-time
    ConnectDriveBody:
      type: object
      required:
        - code
        - redirectUri
        - codeVerifier
      properties:
        code:
          type: string
          minLength: 1
        redirectUri:
          type: string
          minLength: 1
        codeVerifier:
          type: string
          minLength: 43
    DisconnectDriveResponse:
      type: object
      required:
        - disconnected
      properties:
        disconnected:
          type: boolean

